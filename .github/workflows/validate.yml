name: Validate profile

on:
  push:
    paths:
      - README.md
      - assets/**
      - conf/**
      - scripts/**
      - profile-3d-contrib/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check profile assets
        run: python scripts/validate_profile.py --require-full-3d
      - name: Check chart calculations and repository aggregation
        run: python -m unittest discover -s scripts -p "test_*.py"
